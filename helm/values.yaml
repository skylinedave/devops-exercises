namespace:
  create: true
  name: devops

backend:
  replicaCount: 2
  image:
    repository: hashicorp/http-echo
    tag: "1.0"
    pullPolicy: IfNotPresent
  containerPort: 5678
  service:
    type: NodePort
    port: 80
    targetPort: 5678
    nodePort: 30082
  nodeSelector:
    node-role: backend

frontend:
  replicaCount: 2
  image:
    repository: nginx
    tag: "1.29.8"
    pullPolicy: IfNotPresent
  containerPort: 80
  service:
    type: NodePort
    port: 80
    targetPort: 80
    nodePort: 30081
  nodeSelector:
    node-role: frontend

gateway:
  replicaCount: 1
  image:
    repository: nginx
    tag: "1.29.8"
    pullPolicy: IfNotPresent
  containerPort: 80
  service:
    type: NodePort
    port: 80
    targetPort: 80
    nodePort: 30080
