apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: devops
  labels:
    app: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: nginx:1.29.8
          ports:
            - containerPort: 80
